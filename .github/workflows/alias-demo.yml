name: Alias demo URL after main push

on:
  push:
    branches: [main]

jobs:
  alias:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Wait for Vercel deployment matching this commit
        id: wait
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_x0H2JH6Vfp43CXklXkVeMz9tGsvo
          TEAM_ID: team_xFrGlU4JhmP6K59b0YNXFyzS
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 40); do
            JSON=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&limit=10&target=production")
            if [ "$i" = "1" ]; then
              echo "=== First API response (first 500 chars) ==="
              echo "$JSON" | head -c 500
              echo ""
              echo "=== Response keys ==="
              echo "$JSON" | jq -r 'keys[]?' 2>&1 | head -5
              echo "==="
            fi
            URL=$(echo "$JSON" | jq -r --arg sha "$SHA" '.deployments[]? | select(.meta.githubCommitSha == $sha and .readyState == "READY") | .url' 2>/dev/null | head -1)
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              echo "Matching READY deployment found: $URL"
              echo "deploy_url=$URL" >> $GITHUB_OUTPUT
              exit 0
            fi
            ANY=$(echo "$JSON" | jq -r --arg sha "$SHA" '.deployments[]? | select(.meta.githubCommitSha == $sha) | "\(.readyState) \(.url)"' 2>/dev/null | head -1)
            echo "Attempt $i: $ANY"
            sleep 12
          done
          echo "No READY deployment matching $SHA after 8 minutes"
          exit 1

      - name: Re-alias highlife-live.vercel.app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.wait.outputs.deploy_url }}
        run: |
          echo "Aliasing https://$DEPLOY_URL → highlife-live.vercel.app"
          vercel alias set "https://$DEPLOY_URL" highlife-live.vercel.app \
            --scope jchhetree-gmailcoms-projects \
            --token "$VERCEL_TOKEN"

      - name: Notify Telegram on success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id=-5007421055 \
              -d text="Demo URL refreshed: highlife-live.vercel.app now serves ${{ github.sha }}" || true
          fi
